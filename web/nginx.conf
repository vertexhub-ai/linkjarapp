server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hide nginx version from the Server header
    server_tokens off;

    # Baseline security headers for the SPA shell
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-Frame-Options        "DENY"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # gzip text assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml application/xml+rss image/svg+xml;

    # Hashed Vite assets — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* to the api service inside the docker network.
    # The trailing slash on proxy_pass strips the /api prefix, so
    # /api/links -> http://api:3000/links. Port 3000 matches the
    # axum bind in api/src/main.rs and the dev base URL in API.md.
    location /api/ {
        proxy_pass            http://api:3000/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # SPA fallback: any unknown path resolves to index.html so client-side
    # routing works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve hidden files (e.g. .env, .git) if any ever leak into dist.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
